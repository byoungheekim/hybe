<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TUIDE - Debut Teaser</title>
<style>
  :root{
    --bg:#05050a;
    --accent:#e0c88b;
    --accent2:#7d6bff;
    --text:#f5f3ee;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:radial-gradient(ellipse at 50% 0%, #14101f 0%, #05050a 60%, #000 100%);
    color:var(--text);
    font-family:'Helvetica Neue', Arial, sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  .container{
    max-width:900px;
    margin:0 auto;
    padding:60px 24px 100px;
    text-align:center;
  }
  .logo{
    font-size:14px;
    letter-spacing:6px;
    color:var(--accent);
    text-transform:uppercase;
    margin-bottom:24px;
    opacity:0.85;
  }
  h1{
    font-size:clamp(48px, 10vw, 96px);
    letter-spacing:10px;
    font-weight:700;
    background:linear-gradient(120deg, #f5f3ee, var(--accent) 50%, #f5f3ee);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 40px rgba(224,200,139,0.25);
  }
  .subtitle{
    margin-top:12px;
    font-size:16px;
    letter-spacing:3px;
    color:#c9c4d6;
    text-transform:uppercase;
  }
  .photo-wrap{
    margin:48px auto;
    max-width:720px;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 0 60px rgba(125,107,255,0.25), 0 0 0 1px rgba(255,255,255,0.05);
    position:relative;
  }
  .photo-wrap img{
    width:100%;
    display:block;
    filter:contrast(1.05) saturate(0.9);
  }
  .photo-wrap::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(5,5,10,0) 60%, rgba(5,5,10,0.85) 100%);
  }
  .caption{
    margin-top:18px;
    font-size:13px;
    letter-spacing:2px;
    color:#8b86a0;
    text-transform:uppercase;
  }
  .countdown-label{
    margin-top:64px;
    font-size:14px;
    letter-spacing:4px;
    color:var(--accent2);
    text-transform:uppercase;
  }
  .countdown{
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:24px;
    flex-wrap:wrap;
  }
  .unit{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:12px;
    padding:20px 18px;
    min-width:88px;
    backdrop-filter:blur(6px);
  }
  .unit .num{
    font-size:clamp(32px, 6vw, 52px);
    font-weight:700;
    color:var(--text);
    font-variant-numeric:tabular-nums;
  }
  .unit .lbl{
    margin-top:6px;
    font-size:11px;
    letter-spacing:2px;
    color:#9691a8;
    text-transform:uppercase;
  }
  .debut-date{
    margin-top:36px;
    font-size:18px;
    letter-spacing:4px;
    color:var(--accent);
  }
  .footer{
    margin-top:80px;
    font-size:11px;
    letter-spacing:2px;
    color:#565064;
    text-transform:uppercase;
  }
  .glow-line{
    width:60px;
    height:2px;
    margin:28px auto;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
  }
  @media (max-width:480px){
    .countdown{gap:10px;}
    .unit{padding:14px 10px; min-width:70px;}
  }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">GIRL GROUP TEASER</div>
    <h1>TUIDE</h1>
    <div class="subtitle">7인조 신인 여성 아이돌 그룹</div>

    <div class="glow-line"></div>

    <div class="photo-wrap">
      <img src="assets/group_silhouette_teaser_base64.txt" alt="TUIDE 7인 실루엣 단체 사진" id="teaser-img">
    </div>
    <div class="caption">Silhouette Concept · Coming Soon</div>

    <div class="countdown-label">Debut Countdown</div>
    <div class="countdown" id="countdown">
      <div class="unit"><div class="num" id="days">00</div><div class="lbl">Days</div></div>
      <div class="unit"><div class="num" id="hours">00</div><div class="lbl">Hours</div></div>
      <div class="unit"><div class="num" id="minutes">00</div><div class="lbl">Min</div></div>
      <div class="unit"><div class="num" id="seconds">00</div><div class="lbl">Sec</div></div>
    </div>

    <div class="debut-date">2026. 12. 24 DEBUT</div>

    <div class="footer">TUIDE OFFICIAL · ALL RIGHTS RESERVED</div>
  </div>

<script>
  const debutDate = new Date("2026-12-24T00:00:00+09:00").getTime();

  function updateCountdown(){
    const now = new Date().getTime();
    const diff = debutDate - now;

    if(diff <= 0){
      document.getElementById("days").textContent = "00";
      document.getElementById("hours").textContent = "00";
      document.getElementById("minutes").textContent = "00";
      document.getElementById("seconds").textContent = "00";
      document.querySelector(".countdown-label").textContent = "TUIDE HAS DEBUTED";
      return;
    }

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
    const minutes = Math.floor((diff % (1000*60*60)) / (1000*60));
    const seconds = Math.floor((diff % (1000*60)) / 1000);

    document.getElementById("days").textContent = String(days).padStart(2,"0");
    document.getElementById("hours").textContent = String(hours).padStart(2,"0");
    document.getElementById("minutes").textContent = String(minutes).padStart(2,"0");
    document.getElementById("seconds").textContent = String(seconds).padStart(2,"0");
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  // load base64 image
  fetch("assets/group_silhouette_teaser_base64.txt")
    .then(r => r.text())
    .then(b64 => {
      document.getElementById("teaser-img").src = "data:image/jpeg;base64," + b64.trim();
    })
    .catch(err => console.error("image load failed", err));
</script>
</body>
</html>
